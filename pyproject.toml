[project]
name = "tradelab"
version = "0.1.0"
description = "Modular, cost-realistic stock trading system with strict paper-to-live parity and portfolio risk management."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "exchange-calendars>=4.5",
    "typer>=0.12",
    "scipy>=1.13",
]

[project.optional-dependencies]
ibkr = ["ib_async>=1.0.1"]
research = ["matplotlib>=3.8", "statsmodels>=0.14", "duckdb>=1.0"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "hypothesis>=6.100", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
tradelab = "tradelab.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradelab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true
