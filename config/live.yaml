# Live trading overlay.
#
# Settings.  _guard_live_mode rejects several configurations outright in this
# mode (zero commission, disabled next-bar fills, the paper port, any
# leverage), because the cost of those mistakes is asymmetric when real orders
# are being sent.
#
# Set the account id via the environment, never here:
#   export TRADELAB_BROKER__ACCOUNT_ID=U1234567
mode: LIVE

broker:
  name: ibkr
  host: 127.0.0.1
  port: 7496          # IBKR live
  client_id: 1
  readonly: false
  max_reconnect_attempts: 5

# Start live deployment at a fraction of target size and only size up once
# realised costs match modelled costs. See docs/02-architecture.md.
risk:
  position:
    max_position_weight: "0.04"     # 25% of the 15% research target
  portfolio:
    max_open_positions: 8
  loss:
    max_daily_loss_pct: "0.02"      # Tighter than research defaults
    max_drawdown_pct: "0.10"

logging:
  level: INFO

state_path: state/live.sqlite
